<h1>🔐 歩ログ 暗号化起動試験 Phase 3</h1>
<section><b>HTML/CSSは公開・ダミーJavaScriptだけ暗号化</b>
<p>パスワードを入力して、暗号化された描画・操作プログラムを復号します。</p>
<p><small>公開試験用パスワード：<code>ayalog-demo-2026</code></small></p>
<input id="pw" type="password" placeholder="試験用パスワード" autocomplete="off">
<button id="unlock">復号して描画プログラムを起動</button><p id="msg" role="status">待機中</p></section>
<section id="demo" hidden>
<h2>ダミー軌跡 HUD</h2>
<canvas id="track" width="350" height="220"></canvas>
<p id="demoStatus">待機中</p>
<div class="row"><button id="start">START</button><button id="stop">STOP</button><button id="reset">RESET</button><button id="save">履歴保存</button><button id="load">履歴読出し</button></div>
<p id="storage">履歴テスト待機中</p></section>
<section><small>本物の歩ログ、GPS、AYABeat、熊鈴には触れません。描画データは架空のものです。履歴保存はこの試験サイトのlocalStorageだけを使用します。復号後のコードはブラウザから取得できるため完全なソース保護ではありません。</small></section>

 try{

  const password=document.getElementById("pw").value;
  const t0=performance.now();
  const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);

  const js=new TextDecoder().decode(plain);

  const t3=performance.now();
